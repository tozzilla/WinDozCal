<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Palinsesto 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1536px; height: 1024px; overflow: hidden; }
  body { font-family: "Bahnschrift", "Segoe UI Variable Display", sans-serif; background: #F5F6F8; color: #10142A; font-size: 14px; display: grid; grid-template-columns: 64px 1fr; }
  .rail { background: #10142A; color: #C9CDE0; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 16px 0; }
  .rail .logo { width: 36px; height: 36px; border-radius: 8px; background: #E4262B; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .rail .it { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .rail .it.on { background: #1E2547; color: #fff; }
  .rail .bot { margin-top: auto; }
  main { display: grid; grid-template-rows: auto auto auto 1fr; min-width: 0; }
  header { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 22px; background: #fff; border-bottom: 1px solid #DDE0E8; }
  .ib { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #DDE0E8; border-radius: 6px; }
  .btn { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; border: 1px solid #DDE0E8; border-radius: 6px; font-weight: 600; font-size: 13px; }
  .title { font-size: 26px; font-weight: 700; margin-left: 8px; } .sub { font-size: 14px; color: #5B6075; margin-left: 8px; }
  .search { margin-left: auto; width: 230px; height: 32px; border: 1px solid #DDE0E8; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; color: #5B6075; font-size: 13px; }
  .seg { display: flex; border: 1px solid #DDE0E8; border-radius: 6px; overflow: hidden; } .seg span { padding: 7px 12px; font-size: 13px; font-weight: 600; } .seg .on { background: #10142A; color: #fff; }
  .plus { width: 34px; height: 32px; border-radius: 6px; background: #10142A; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 12px 22px; background: #fff; border-bottom: 1px solid #DDE0E8; }
  .day { border: 1px solid #DDE0E8; border-radius: 6px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; }
  .day b { grid-row: span 2; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; } .day small { font-size: 11px; letter-spacing: .12em; color: #5B6075; text-transform: uppercase; }
  .bars { display: flex; gap: 2px; height: 8px; } .bars i { flex: var(--w); background: var(--c); border-radius: 1px; }
  .day.on { background: #10142A; color: #fff; border-color: #10142A; } .day.on small { color: #C9CDE0; } .day.on b { color: #fff; }
  .heads { display: grid; grid-template-columns: 64px repeat(4, 1fr); background: #fff; border-bottom: 1px solid #DDE0E8; }
  .heads div { padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; border-left: 1px solid #DDE0E8; }
  .heads div:first-child { border-left: 0; }
  .heads i { width: 10px; height: 26px; background: var(--c); border-radius: 2px; } .heads small { display: block; font-size: 11px; color: #5B6075; font-weight: 600; letter-spacing: .06em; }
  .grid { position: relative; display: grid; grid-template-columns: 64px repeat(4, 1fr); overflow: hidden; background: #fff; }
  .hours div { height: 64px; font-size: 16px; font-weight: 700; text-align: right; padding: 2px 10px 0 0; font-variant-numeric: tabular-nums; }
  .col { position: relative; border-left: 1px solid #E3E6EE; background-image: linear-gradient(#ECEEF3 1px, transparent 1px); background-size: 100% 64px; }
  .ev { position: absolute; left: 6px; right: 6px; padding: 7px 10px; border-radius: 5px; font-size: 13.5px; line-height: 1.3; overflow: hidden; border-left: 6px solid var(--c); background: var(--bg); }
  .ev .t { font-weight: 700; font-size: 14px; display: block; font-variant-numeric: tabular-nums; } .ev .n { font-weight: 700; } .ev .m2 { display: block; color: #5B6075; font-size: 12.5px; margin-top: 2px; }
  .g { --c: #2F6BFF; --bg: #EAF0FF; } .gc { --c: #5B8CFF; --bg: #EEF2FF; } .m { --c: #1BA672; --bg: #E6F6EF; } .l { --c: #F2A900; --bg: #FFF5DB; }
  .free { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(16,20,42,.12) 5px 6px); }
  .onair { box-shadow: 0 0 0 2px #E4262B; }
  .tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .12em; padding: 2px 6px; border-radius: 3px; margin-bottom: 4px; }
  .tag.on { background: #E4262B; color: #fff; } .tag.next { background: #10142A; color: #fff; } .tag.cf { background: #FFF1F1; color: #B3171C; border: 1px solid #F5B5B7; }
  .now { position: absolute; left: 64px; right: 0; height: 3px; background: #E4262B; z-index: 5; }
  .nowlab { position: absolute; left: 4px; background: #E4262B; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 5px; border-radius: 3px; transform: translateY(-50%); z-index: 6; letter-spacing: .04em; }
</style>
</head>
<body>
  <nav class="rail">
    <span class="logo">W</span>
    <span class="it on">CAL</span><span class="it">⌕</span><span class="it">+</span>
    <span class="it bot">⚙</span>
  </nav>
  <main>
    <header>
      <span class="ib">‹</span><span class="ib">›</span><span class="btn">Oggi</span>
      <span class="title">Mercoledì 7</span><span class="sub">ottobre 2026 · 4 canali</span>
      <span class="search">Cerca eventi <span>Ctrl+K</span></span>
      <span class="seg"><span class="on">Giorno</span><span>Settimana</span><span>Mese</span><span>Agenda</span></span>
      <span class="plus">+</span>
    </header>
    <div class="strip" id="strip"></div>
    <div class="heads">
      <div></div>
      <div style="--c:#F2A900"><i></i><span>Personale<small>QUESTO COMPUTER</small></span></div>
      <div style="--c:#2F6BFF"><i></i><span>Riunioni<small>GOOGLE · LAVORO</small></span></div>
      <div style="--c:#5B8CFF"><i></i><span>Commerciale<small>GOOGLE · LAVORO</small></span></div>
      <div style="--c:#1BA672"><i></i><span>Cliente<small>MICROSOFT · STUDIO ROSSI</small></span></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
<script>
  const H = 64, START = 8;
  const days = [["Lun",5,[[2,"#2F6BFF"],[1,"#F2A900"]]],["Mar",6,[[1,"#1BA672"],[2,"#2F6BFF"]]],["Mer",7,[[3,"#2F6BFF"],[2,"#1BA672"],[2,"#F2A900"]]],["Gio",8,[[2,"#2F6BFF"]]],["Ven",9,[[2,"#F2A900"]]],["Sab",10,[[3,"#F2A900"]]],["Dom",11,[]]];
  document.getElementById("strip").innerHTML = days.map(([d,n,b],i)=>`<div class="day ${i===2?"on":""}"><b>${n}</b><small>${d}</small><span class="bars">${b.map(([w,c])=>`<i style="--w:${w};--c:${c}"></i>`).join("")}</span></div>`).join("");
  const ev = [
    [0, 11, 11.5, "Standup", "l", ""], [0, 12.75, 13.5, "Pranzo veloce", "l", "free"], [0, 19, 20, "Palestra", "l", ""],
    [1, 9, 10, "Planning settimanale", "g", ""], [1, 13.75, 15.25, "Revisione progetto", "g", "onair", "Sala 2 · 4 partecipanti"], [1, 16.25, 17.25, "Sintesi con Marta", "g", "next", "Google Meet"],
    [2, 10, 11, "Offerta Bianchi Srl", "gc", "", "Bozza da chiudere"], [2, 15.5, 16.5, "Follow-up lead", "gc", "free"],
    [3, 9.5, 10.25, "Allineamento Studio Rossi", "m", ""], [3, 14.5, 16, "Call Studio Rossi", "m", "conflict", "Teams · sovrapposta a Revisione progetto"],
  ];
  const fmt = h => `${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round((h%1)*60)).padStart(2,"0")}`;
  let html = `<div class="hours">${Array.from({length:13},(_,i)=>`<div>${fmt(START+i)}</div>`).join("")}</div>`;
  html += [0,1,2,3].map(ci => `<div class="col">` + ev.filter(e=>e[0]===ci).map(([,s,e,t,a,x,meta=""]) => {
    const tag = x==="onair"?'<span class="tag on">IN ONDA</span>':x==="next"?'<span class="tag next">A SEGUIRE</span>':x==="conflict"?'<span class="tag cf">SOVRAPPOSTO</span>':"";
    return `<div class="ev ${a} ${x}" style="top:${(s-START)*H+1}px;height:${(e-s)*H-3}px">${tag}<span class="t">${fmt(s)}–${fmt(e)}</span><span class="n">${t}</span>${meta?`<span class="m2">${meta}</span>`:""}</div>`;
  }).join("") + `</div>`).join("");
  const y = (14 + 20/60 - START) * H;
  html += `<div class="now" style="top:${y}px"></div><div class="nowlab" style="top:${y}px">IN ONDA</div>`;
  document.getElementById("grid").innerHTML = html;
</script>
</body>
</html>
